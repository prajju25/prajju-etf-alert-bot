name: Refresh NSE Holidays

on:
  # Auto-run on January 2nd each year at 8:00 AM IST (2:30 AM UTC)
  schedule:
    - cron: "30 2 2 1 *"

  # Allow manual trigger anytime from the Actions tab
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token that can push commits back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Fetch and cache NSE holidays
        run: node src/jobs/refreshHolidays.js

      - name: Commit updated holiday cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nse-holidays.json
          git diff --staged --quiet || git commit -m "chore: refresh NSE holidays for $(date +%Y)"
          git push
